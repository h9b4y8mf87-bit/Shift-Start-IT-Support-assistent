<section class="ss-enterprise-trust-footer" aria-label="Enterprise trust and governance">
  <div class="shell ss-trust-footer-grid">
    <div><p class="rd-eyebrow">Enterprise trust</p><strong>Last site build</strong><time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: '%Y-%m-%d %H:%M UTC' }}</time></div>
    <div class="ss-trust-badges" aria-label="Compliance readiness">
      <span class="ss-trust-badge ss-trust-neutral"><i aria-hidden="true">○</i><span><strong>SOC 2</strong><small>Not attested</small></span></span>
      <span class="ss-trust-badge ss-trust-neutral"><i aria-hidden="true">○</i><span><strong>GDPR readiness</strong><small>Review required</small></span></span>
    </div>
    <button class="btn-secondary" type="button" data-open-error-modal>Report an Error</button>
  </div>
</section>
