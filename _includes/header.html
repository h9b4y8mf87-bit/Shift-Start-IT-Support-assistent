<header class="site-header" data-site-header>
  <div class="site-bar">
    <div class="shell site-bar-inner">
      <a class="site-brand sv-brand" href="{{ '/' | relative_url }}" aria-label="ShiftStart knowledge base home">
        <span class="site-brand-mark sv-brand-mark" aria-hidden="true">S</span>
        <span class="sv-brand-copy"><strong>ShiftStart KB</strong><small>Controlled IT support knowledge</small></span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="{{ '/#wizard' | relative_url }}">Symptom wizard</a>
        <a href="{{ '/procedures/' | relative_url }}">Procedures</a>
        <a href="{{ '/enterprise-coverage/' | relative_url }}">Coverage</a>
        <a href="{{ '/content-quality/' | relative_url }}">Quality</a>
      </nav>

      <div class="header-actions">
        <button class="header-icon-button" type="button" data-search-toggle aria-controls="search-region" aria-expanded="false">
          <span class="sr-only">Open search</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </button>
        <button class="header-icon-button mobile-menu-button" type="button" data-menu-toggle aria-controls="mobile-navigation" aria-expanded="false">
          <span class="sr-only">Open navigation menu</span>
          <svg class="menu-open-icon" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
          <svg class="menu-close-icon" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
      </div>
    </div>

    <nav id="mobile-navigation" class="mobile-nav" aria-label="Mobile navigation" hidden>
      <div class="shell mobile-nav-grid">
        <a href="{{ '/#wizard' | relative_url }}">Symptom wizard</a>
        <a href="{{ '/procedures/' | relative_url }}">Procedures</a>
        <a href="{{ '/symptoms/' | relative_url }}">Symptoms</a>
        <a href="{{ '/enterprise-coverage/' | relative_url }}">Coverage</a>
        <a href="{{ '/content-quality/' | relative_url }}">Quality</a>
      </div>
    </nav>
  </div>

  <div id="search-region" class="search-panel" data-search-region>
    <div class="shell search-shell">
      <div class="search-field-wrap">
        <svg class="search-field-icon" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label class="sr-only" for="kb-search">Search the knowledge base</label>
        <input id="kb-search" class="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search symptoms, error codes, commands…" aria-controls="search-results" aria-autocomplete="list" aria-expanded="false">
        <button class="search-clear" type="button" data-search-clear aria-label="Clear search" hidden>Clear</button>
        <span class="search-shortcut" aria-hidden="true">/</span>
      </div>
      <div id="search-results" class="search-results hidden" role="listbox" aria-label="Search results"></div>
      <p id="search-status" class="sr-only" aria-live="polite"></p>
    </div>
  </div>
</header>
