defects_found:
  - id: RANSOM-001
    severity: critical
    finding: The generic Step 1 instructs the technician to reproduce the original user task.
    risk: Re-executing suspicious content can worsen encryption, propagation, data loss or evidence contamination.
    correction: Never reproduce or re-open suspected ransomware payloads. Validate the alert from telemetry and preserved evidence.
  - id: RANSOM-002
    severity: high
    finding: Generic preconditions prioritise unsaved user work before security containment.
    risk: Containment can be delayed during an active attack.
    correction: Containment and evidence preservation take precedence; do not shut down unless isolation cannot be achieved or the approved IR plan requires it.
  - id: RANSOM-003
    severity: medium
    finding: The endpoint protection PowerShell command is useful context but insufficient as the primary ransomware diagnostic.
    risk: A healthy Defender status does not establish ransomware scope or containment.
    correction: Treat endpoint protection state as one evidence point and require incident/alert, device, identity, network and lateral-movement evidence.

verified_by_source_review:
  immediate_isolation_required: true
  preserve_evidence_required: true
  containment_before_recovery: true
  release_from_isolation_only_after_mitigation_and_investigation: true

